# GitHub Pages yayın iş akışı.
# Repository → Settings → Pages → Source: "GitHub Actions" seçili olmalıdır.
# Site adresi ve alt yol (base) actions/configure-pages çıktısından otomatik alınır:
#   - kullanici.github.io/repo-adi  → BASE_PATH=/repo-adi/
#   - özel alan adı / kullanici.github.io deposu → BASE_PATH=/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Nihai yayında arama motorlarına açmak için "false" yapın:
          PUBLIC_NOINDEX: "true"
      - name: Check links and assets
        run: npm run check:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
